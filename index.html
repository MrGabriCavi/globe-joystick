<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#05060a">
<title>Globe Joystick</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #05060a;
    --ink: #e8e6df;
    --dim: #7c7c88;
    --red: #ff2a2a;
    --amber: #ffb000;
    --green: #39ff7a;
    --stick: clamp(140px, min(44vw, 36vh), 250px);
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: var(--bg); color: var(--ink);
    font-family: 'Press Start 2P', ui-monospace, Consolas, monospace;
  }
  body {
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
    overscroll-behavior: none;
  }
  #scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #objects { position: fixed; inset: 0; width: 100%; height: 100%; display: block; pointer-events: none; }

  /* HUD */
  .hud {
    position: fixed; pointer-events: none;
    top: calc(14px + env(safe-area-inset-top)); left: calc(16px + env(safe-area-inset-left));
  }
  .title { font-size: 14px; letter-spacing: 2px; color: var(--amber); text-shadow: 0 0 8px rgba(255,176,0,.55); }
  .title span { color: var(--red); }
  .coords { margin-top: 10px; font-size: 9px; color: var(--green); text-shadow: 0 0 6px rgba(57,255,122,.45); }
  .status { margin-top: 8px; font-size: 8px; color: var(--amber); min-height: 1em; }
  .satbar { margin-top: 4px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .satbar select {
    pointer-events: auto; cursor: pointer;
    font: 8px 'Press Start 2P', ui-monospace, monospace; color: var(--amber);
    background: #111116; border: 1px solid #33333d; border-radius: 6px; padding: 6px 8px;
  }
  .satinfo { font-size: 7px; color: var(--dim); line-height: 1.6; }

  /* Schedina del satellite */
  .card {
    position: fixed; z-index: 5;
    top: calc(64px + env(safe-area-inset-top)); right: calc(16px + env(safe-area-inset-right));
    width: 310px; max-height: calc(100dvh - var(--stick) - 150px); overflow-y: auto;
    padding: 16px; border-radius: 14px;
    background: rgba(12,12,16,.94); border: 1px solid #2a2a33;
    box-shadow: 0 12px 40px rgba(0,0,0,.6);
    font: 12px/1.45 ui-monospace, Consolas, monospace; color: var(--ink);
    -webkit-user-select: text; user-select: text;
  }
  .card-title { font: 11px/1.6 'Press Start 2P', monospace; color: var(--amber); padding-right: 30px; }
  .card-sub { margin-top: 6px; color: var(--dim); }
  .card-img { display: block; width: 100%; height: 140px; object-fit: cover; border-radius: 8px; margin-top: 12px; background: #111; }
  .card-credit { display: block; margin-top: 4px; font-size: 10px; color: var(--dim); text-decoration: none; }
  .card-credit:hover { color: var(--amber); }
  .card-desc { margin: 10px 0 0; font: 13px/1.45 system-ui, sans-serif; color: #c9c7c0; }
  .card-grid { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; margin: 12px 0 0; }
  .card-grid dt { color: var(--dim); }
  .card-grid dd { margin: 0; text-align: right; color: var(--green); }
  .card-grid + .card-grid { border-top: 1px solid #22222a; padding-top: 12px; }
  .card-close {
    position: absolute; top: 10px; right: 10px; width: 30px; height: 30px; border-radius: 50%;
    border: 1px solid #33333d; background: #1a1a20; color: var(--ink); font-size: 14px; cursor: pointer;
  }
  .card-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
  /* Pulsantone del minigioco di attracco (solo nella schedina della ISS) */
  .dock-btn {
    display: block; margin-top: 14px; padding: 15px 12px; border-radius: 12px; text-align: center;
    font: 10px 'Press Start 2P', monospace; color: #1a0f00; text-decoration: none;
    background: linear-gradient(#ffd25a, #ff9d00); box-shadow: 0 4px 0 #8a5200, 0 6px 14px rgba(0,0,0,.5);
  }
  .dock-btn:hover { filter: brightness(1.08); }
  .dock-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #8a5200; }
  .pill {
    font: 8px 'Press Start 2P', monospace; padding: 9px 11px; border-radius: 999px; cursor: pointer;
    border: 1px solid #3a3a44; background: #16161c; color: var(--ink); text-decoration: none;
  }
  .pill:hover { border-color: var(--amber); color: var(--amber); }
  .overhead-btn { pointer-events: auto; color: #4fe3ff; border-color: #22505a; }
  .iss-btn { pointer-events: auto; color: var(--green); border-color: #1f5a35; }
  .records { margin-top: 8px; display: flex; flex-wrap: wrap; gap: 6px; }
  .rec-btn { pointer-events: auto; font-size: 7px; padding: 7px 9px; color: var(--amber); border-color: #4a3a12; }
  .card-list { display: flex; flex-direction: column; gap: 6px; margin-top: 12px; }
  .card-section { font: 9px/1.6 'Press Start 2P', monospace; color: var(--amber); margin-top: 8px; padding-top: 12px; border-top: 1px solid #22222a; }
  /* Righe degli oggetti di N2YO: il colore dice il tipo, come le icone sul globo */
  .all-row { --k: #ffc23a; }
  .all-row.k-station { --k: #f2f4f8; }
  .all-row.k-rb { --k: #ff8a1f; }
  .all-row.k-deb { --k: #a7aeb8; }
  .all-row span:first-child::before { content: '■ '; color: var(--k); }
  .all-row span:last-child { color: var(--k); }
  .all-row:hover { border-color: var(--k); }
  .card-list p { margin: 0 0 4px; font: 13px/1.45 system-ui, sans-serif; color: #c9c7c0; }
  .card-list .pill { align-self: flex-start; }
  .sat-row {
    display: flex; justify-content: space-between; gap: 10px; width: 100%; padding: 8px 10px;
    border: 1px solid #26262e; border-radius: 8px; background: #121218; color: var(--ink);
    font: 12px ui-monospace, Consolas, monospace; text-align: left; cursor: pointer;
  }
  .sat-row span:last-child { color: #4fe3ff; white-space: nowrap; }
  .sat-row:hover { border-color: #4fe3ff; }
  .hint {
    position: fixed; margin: 0; pointer-events: none;
    top: calc(14px + env(safe-area-inset-top)); right: calc(16px + env(safe-area-inset-right));
    max-width: 320px; text-align: right; font-size: 8px; line-height: 1.8; color: var(--dim);
  }

  /* Pannello comandi stile cabinato */
  .deck {
    position: fixed;
    right: calc(16px + env(safe-area-inset-right));
    bottom: calc(16px + env(safe-area-inset-bottom));
    display: flex; align-items: center; gap: 18px;
    padding: 20px 20px 38px;   /* sotto, lo spazio per la bandierina */
    background: linear-gradient(#18181e, #09090c);
    border: 1px solid #2a2a33; border-radius: 18px;
    box-shadow: 0 12px 40px rgba(0,0,0,.65), inset 0 1px 0 rgba(255,255,255,.06);
    touch-action: none;
  }
  .deck::before {
    content: ''; position: absolute; left: 18px; right: 18px; top: 0; height: 5px;
    background: linear-gradient(90deg, var(--red) 0 33%, #ff7a00 33% 66%, #ffd000 66%);
    border-radius: 0 0 4px 4px;
  }
  .deck::after {
    content: 'PLAYER 1'; position: absolute; left: 22px; top: 10px;
    font-size: 6px; color: #4a4a55; letter-spacing: 1px;
  }

  /* Bandierina della lingua, in basso a destra nel pannello: mostra la lingua in cui si passa */
  .lang-btn {
    position: absolute; bottom: 9px; right: 20px; width: 30px; height: 20px; padding: 0;
    border: 1px solid #3a3a44; border-radius: 3px; overflow: hidden; cursor: pointer;
    background: #111; opacity: .8; transition: opacity .1s, transform .1s;
  }
  .lang-btn:hover, .lang-btn:focus-visible { opacity: 1; transform: scale(1.12); }
  .lang-btn:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
  .lang-btn svg { display: block; width: 100%; height: 100%; }
  /* Informazioni, crediti e privacy: in basso a sinistra, speculare alla bandierina */
  .info-link {
    position: absolute; bottom: 10px; left: 20px; padding: 5px 8px; border-radius: 999px;
    font-size: 6px; color: var(--dim); text-decoration: none; border: 1px solid #33333d; background: #101014;
  }
  .info-link:hover, .info-link:focus-visible { color: var(--amber); border-color: var(--amber); }

  /* Saluto di Gabriele: avatar con fumetto in basso a sinistra, si chiude e non torna */
  .host {
    position: fixed; z-index: 5;
    left: calc(16px + env(safe-area-inset-left)); bottom: calc(16px + env(safe-area-inset-bottom));
    display: flex; align-items: flex-end; gap: 10px; max-width: min(360px, calc(100vw - 32px));
    pointer-events: none;
  }
  .host[hidden] { display: none; }
  .host img {
    width: 72px; height: 72px; flex: none; border-radius: 50%;
    border: 2px solid var(--amber); box-shadow: 0 6px 24px rgba(0,0,0,.6); background: #101014;
  }
  .host-bubble {
    position: relative; margin-bottom: 30px; padding: 12px 30px 12px 14px; pointer-events: auto;
    font-size: 9px; line-height: 1.7; color: #e8e8ec;
    background: linear-gradient(#18181e, #0d0d11); border: 1px solid #2a2a33; border-radius: 14px;
    box-shadow: 0 12px 40px rgba(0,0,0,.65);
  }
  .host-bubble::before {   /* la punta del fumetto verso l'avatar */
    content: ''; position: absolute; left: -7px; bottom: 14px; width: 12px; height: 12px;
    background: #111116; border-left: 1px solid #2a2a33; border-bottom: 1px solid #2a2a33;
    transform: rotate(45deg);
  }
  .host-close {
    position: absolute; top: 4px; right: 6px; padding: 2px 6px; border: 0; background: none;
    color: var(--dim); font: inherit; font-size: 11px; cursor: pointer;
  }
  .host-close:hover, .host-close:focus-visible { color: var(--amber); }

  #stick { width: var(--stick); height: var(--stick); display: block; touch-action: none; cursor: grab; }
  #stick.grabbing { cursor: grabbing; }

  .readout { display: flex; flex-direction: column; align-items: center; gap: 10px; width: 92px; }
  .leds { display: grid; grid-template-columns: repeat(3, 22px); gap: 5px; }
  .leds span {
    width: 22px; height: 22px; border-radius: 5px; display: grid; place-items: center;
    background: #1c0707; color: #552020; font: 11px/1 system-ui, sans-serif;
    transition: background .08s, box-shadow .08s, color .08s;
  }
  .leds span.on { background: var(--red); color: #fff; box-shadow: 0 0 10px var(--red); }
  .leds span.center { background: #06180d; color: #1d4a2c; }
  .leds span.center.on { background: var(--green); color: #032; box-shadow: 0 0 10px var(--green); }
  .vals { width: 100%; font-size: 7px; line-height: 1.9; color: var(--green); }
  .power { width: 100%; height: 6px; border-radius: 3px; background: #1b1b22; overflow: hidden; }
  #powerBar { height: 100%; width: 0; background: linear-gradient(90deg, var(--green), var(--amber) 60%, var(--red)); }

  /* MASTER ARM: interruttore a levetta sotto uno sportellino rosso a strisce, come quelli per
     armare i missili. Chiuso = SAFE (solo satelliti e stazioni), aperto e levetta su = ARM. */
  .arm {
    display: flex; align-items: center; gap: 8px; width: 100%; margin-top: 2px; padding: 0;
    border: 0; background: none; cursor: pointer; color: var(--dim); text-align: left;
    font: 6px/1.7 'Press Start 2P', monospace;
  }
  .arm:focus-visible { outline: 2px solid var(--amber); outline-offset: 3px; border-radius: 4px; }
  .arm-base {
    position: relative; flex: none; width: 26px; height: 34px; border-radius: 4px; perspective: 90px;
    background: repeating-linear-gradient(-45deg, #e8b400 0 4px, #141414 4px 8px);
    box-shadow: inset 0 0 0 3px #0c0c0f, 0 1px 0 rgba(255,255,255,.06);
  }
  .arm-base::before {   /* dado del perno */
    content: ''; position: absolute; left: 50%; top: 50%; width: 10px; height: 10px; margin: -5px 0 0 -5px;
    border-radius: 50%; background: radial-gradient(circle at 35% 35%, #d8d8dc, #4a4a50);
  }
  .arm-lever {
    position: absolute; left: 50%; top: 50%; width: 5px; height: 13px; margin-left: -2.5px;
    border-radius: 3px; background: linear-gradient(90deg, #6a6a70, #f4f4f6 45%, #7a7a80);
    transform-origin: 50% 0; transform: rotate(0deg); transition: transform .15s .12s;
  }
  .arm-cover {
    position: absolute; inset: -2px; border-radius: 5px; transform-origin: 50% 0;
    background: linear-gradient(rgba(255,255,255,.18), transparent 40%),
      repeating-linear-gradient(0deg, #c41212 0 3px, #a00b0b 3px 6px);
    border: 1px solid #ff6a6a; box-shadow: 0 2px 4px rgba(0,0,0,.6);
    transition: transform .25s;
  }
  .arm-state { font-weight: normal; color: var(--green); }
  .arm[aria-checked="true"] .arm-cover { transform: rotateX(78deg); }
  .arm[aria-checked="true"] .arm-lever { transform: rotate(180deg); }
  .arm[aria-checked="true"] .arm-state { color: var(--red); text-shadow: 0 0 6px var(--red); }

  /* Leva dello zoom, come la manetta di un aereo: su avvicina, giù allontana */
  .zoom { display: flex; flex-direction: column; align-items: center; gap: 7px; font-size: 6px; color: var(--dim); }
  .zoom-track {
    position: relative; width: 26px; height: calc(var(--stick) - 18px); border-radius: 13px;
    background: linear-gradient(90deg, #050507, #15151b 50%, #050507); border: 1px solid #2a2a33;
    box-shadow: inset 0 2px 6px rgba(0,0,0,.7); cursor: ns-resize; touch-action: none;
  }
  .zoom-track::before {   /* tacche */
    content: ''; position: absolute; inset: 10px 5px; pointer-events: none;
    background: repeating-linear-gradient(#3a3a44 0 1px, transparent 1px 12%);
  }
  .zoom-knob {
    position: absolute; left: -7px; width: 38px; height: 20px; margin-top: -10px; border-radius: 6px;
    background: linear-gradient(#f2f2f6, #9a9aa4 55%, #55555f); border: 1px solid #040405;
    box-shadow: 0 4px 8px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.7);
    pointer-events: none;
  }
  .zoom-knob::after { content: ''; position: absolute; left: 6px; right: 6px; top: 9px; height: 2px; background: var(--amber); }
  .zoom-track:focus-visible { outline: 2px solid var(--amber); outline-offset: 4px; }

  .buttons { display: flex; flex-direction: column; gap: 12px; }
  .btn { display: flex; flex-direction: column; align-items: center; gap: 7px; font-size: 6px; color: var(--dim); }
  .arcade {
    --c1: #ff9a9a; --c2: #e01010; --c3: #6a0000;
    width: 50px; height: 50px; border: 0; border-radius: 50%; padding: 0; cursor: pointer;
    background: radial-gradient(circle at 35% 30%, var(--c1), var(--c2) 45%, var(--c3));
    box-shadow: 0 0 0 4px #040405, 0 5px 0 4px #040405, 0 8px 12px 4px rgba(0,0,0,.5), inset 0 -4px 6px rgba(0,0,0,.35);
    transition: transform .06s, box-shadow .06s;
    touch-action: manipulation;
  }
  .arcade.yellow { --c1: #fff2a0; --c2: #ffc400; --c3: #8a5a00; }
  .arcade:active, .arcade.pressed {
    transform: translateY(3px);
    box-shadow: 0 0 0 4px #040405, 0 2px 0 4px #040405, 0 3px 6px 4px rgba(0,0,0,.5), inset 0 -2px 4px rgba(0,0,0,.35);
  }
  .arcade:focus-visible { outline: 2px solid var(--amber); outline-offset: 6px; }

  /* Telefono in verticale: pannello a tutta larghezza in basso */
  @media (max-aspect-ratio: 1/1) {
    .deck {
      left: 0; right: 0; bottom: 0; justify-content: space-evenly; gap: 6px;
      padding: 22px 10px calc(36px + env(safe-area-inset-bottom));
      border-radius: 18px 18px 0 0; border-bottom: 0;
    }
    .lang-btn { bottom: calc(8px + env(safe-area-inset-bottom)); right: 14px; }
    .info-link { bottom: calc(9px + env(safe-area-inset-bottom)); left: 14px; }
    /* Il saluto sale sopra il pannello, che qui occupa tutta la larghezza */
    .host { left: 10px; bottom: calc(var(--deck-h, 260px) + 10px); }
    .host img { width: 52px; height: 52px; }
    .host-bubble { margin-bottom: 22px; font-size: 8px; }
    .hint { display: none; }
    .card {
      right: calc(12px + env(safe-area-inset-right));
      top: calc(var(--hud-bottom, 128px) + 10px); width: min(400px, calc(100vw - 24px));
      max-height: min(calc(100dvh - var(--stick) - var(--hud-bottom, 128px) - 82px), 42dvh);
    }
    .card-img { height: 90px; }
  }
  @media (max-width: 380px) {
    .readout { width: 78px; }
    .leds { grid-template-columns: repeat(3, 19px); gap: 4px; }
    .leds span { width: 19px; height: 19px; }
    .arcade { width: 42px; height: 42px; }
    .zoom-track { width: 22px; }
    .zoom-knob { left: -6px; width: 32px; }
  }
</style>
<script type="importmap">
  { "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "satellite.js": "https://cdn.jsdelivr.net/npm/satellite.js@6.0.2/+esm"
  } }
</script>
</head>
<body>
<canvas id="scene"></canvas>
<canvas id="objects"></canvas>

<header class="hud">
  <div class="title">GLOBE<span>·</span>STICK</div>
  <div class="coords" id="coords">LAT --  LON --</div>
  <div class="status" id="status">CARICAMENTO…</div>
  <div class="satbar">
    <select id="group" data-i18n-aria="groupAria" aria-label="Gruppo di satelliti"></select>
    <button class="pill overhead-btn" id="btnOverhead" data-i18n="aboveMe">◎ SOPRA DI ME</button>
    <button class="pill iss-btn" id="btnIss" data-i18n="goIss">✦ VAI A ISS</button>
    <div class="satinfo" id="satinfo"></div>
  </div>
  <div class="records">
    <button class="pill rec-btn" data-record="fastest" data-i18n="recFastest" data-i18n-title="recFastestTitle">» IL PIÙ VELOCE</button>
    <button class="pill rec-btn" data-record="slowest" data-i18n="recSlowest" data-i18n-title="recSlowestTitle">« IL PIÙ LENTO</button>
    <button class="pill rec-btn" data-record="farthest" data-i18n="recFarthest" data-i18n-title="recFarthestTitle">↑ IL PIÙ LONTANO</button>
    <button class="pill rec-btn" data-record="closest" data-i18n="recClosest" data-i18n-title="recClosestTitle">↓ IL PIÙ VICINO</button>
  </div>
</header>
<p class="hint" data-i18n-html="hint">Trascina la leva · Frecce o WASD<br>Zoom: leva, rotella, pinch o + e −<br>Clic su un satellite per la scheda</p>

<aside class="card" id="card" hidden>
  <button class="card-close" id="cardClose" data-i18n-aria="close" aria-label="Chiudi">✕</button>
  <div class="card-title" id="cardTitle"></div>
  <div class="card-sub" id="cardSub"></div>
  <img class="card-img" id="cardImg" alt="" hidden>
  <a class="card-credit" id="cardImgCredit" target="_blank" rel="noopener" hidden data-i18n="photoCredit">Foto: Wikimedia Commons · autore e licenza ↗</a>
  <p class="card-desc" id="cardDesc" hidden></p>
  <dl class="card-grid" id="cardLive"></dl>
  <dl class="card-grid" id="cardInfo"></dl>
  <div class="card-list" id="cardList" hidden></div>
  <div class="card-list" id="cardAll" hidden></div>
  <div class="card-actions">
    <button class="pill" id="cardCenter" data-i18n="center">CENTRA</button>
    <a class="pill" id="cardN2yo" target="_blank" rel="noopener">N2YO ↗</a>
    <a class="pill" id="cardWiki" target="_blank" rel="noopener" hidden>WIKI ↗</a>
  </div>
  <a class="dock-btn" id="cardDock" href="dock.html" hidden data-i18n="dockTry">▶ PROVA L'ATTRACCO</a>
</aside>

<aside class="host" id="host" hidden>
  <img src="avatar.webp" alt="" width="72" height="72">
  <div class="host-bubble" role="note">
    <span data-i18n="hostSays"></span>
    <button class="host-close" id="hostClose" data-i18n-aria="close" aria-label="Chiudi">✕</button>
  </div>
</aside>

<section class="deck" id="deck">
  <button class="lang-btn" id="btnLang"></button>
  <a class="info-link" href="about.html" data-i18n="info">INFO</a>
  <div class="readout">
    <div class="leds" id="leds">
      <span>↖</span><span>↑</span><span>↗</span>
      <span>←</span><span class="center">●</span><span>→</span>
      <span>↙</span><span>↓</span><span>↘</span>
    </div>
    <div class="vals"><div id="valX">X +0.00</div><div id="valY">Y +0.00</div></div>
    <div class="power"><div id="powerBar"></div></div>
    <button class="arm" id="btnArm" role="switch" aria-checked="false">
      <span class="arm-base"><span class="arm-lever"></span><span class="arm-cover"></span></span>
      <span class="arm-text">MASTER<br>ARM<br><b class="arm-state" id="armState">SAFE</b></span>
    </button>
  </div>
  <canvas id="stick" role="application" data-i18n-aria="stickAria" aria-label="Joystick: trascina o usa le frecce"></canvas>
  <div class="zoom">
    <div class="zoom-track" id="zoomLever" role="slider" tabindex="0" aria-orientation="vertical"
         aria-valuemin="0" aria-valuemax="100" data-i18n-aria="zoomAria" aria-label="Zoom"><div class="zoom-knob" id="zoomKnob"></div></div>
    ZOOM
  </div>

function fallbackTexture() {

  grad.addColorStop(0, '#0d2a4a'); grad.addColorStop(0.5, '#1d5a8a'); grad.addColorStop(1, '#0d2a4a');

}

const EARTH_RADIUS_KM = 6371;
function latLonToVector3(lat, lon, alt = 0, target = new THREE.Vector3()) {
  const phi = (lon + 180) * DEG, theta = (90 - lat) * DEG, r = 1 + alt;
  return target.set(
    -r * Math.cos(phi) * Math.sin(theta),
     r * Math.cos(theta),
     r * Math.sin(phi) * Math.sin(theta),
  );
}

function addMarker(lat, lon, { altKm = 0, color = 0xff3030, size = 0.014 } = {}) {
  const m = new THREE.Mesh(new THREE.SphereGeometry(size, 16, 12), new THREE.MeshBasicMaterial({ color }));
  latLonToVector3(lat, lon, altKm / EARTH_RADIUS_KM, m.position);
  satellitesLayer.add(m);
  return m;
}

  const top = fullWidthDeck ? 56 : 0;
  const bottom = fullWidthDeck ? d.top : h;

function sizeStick() {
  const dpr = Math.min(window.devicePixelRatio || 1, 3);
  const s = Math.round(stick.clientWidth * dpr);
  if (stick.width !== s) { stick.width = stick.height = s; joy.dirty = true; }

  const r = stick.getBoundingClientRect();
  const travel = r.width * KNOB_TRAVEL;

  let y = -(e.clientY - (r.top + r.height / 2)) / travel;

  else if (e.code === 'KeyM') toggleMode();
  else if (e.code === 'KeyI') goToIss();
  else if (e.code === 'Escape') selectSat(null);
});
window.addEventListener('keyup', (e) => { const k = KEYMAP[e.code]; if (k) joy.keys.delete(k); });

function updateJoystick(dt) {
  const px = joy.x, py = joy.y;
  if (joy.dragging) {
    joy.x = joy.dragX; joy.y = joy.dragY;
  } else {
    let tx = (joy.keys.has('right') ? 1 : 0) - (joy.keys.has('left') ? 1 : 0);
    let ty = (joy.keys.has('up') ? 1 : 0) - (joy.keys.has('down') ? 1 : 0);
    const m = Math.hypot(tx, ty);
    if (m > 1) { tx /= m; ty /= m; }
    // Integrazione a passi fissi per tenere stabile la molla anche a pochi fps.
    const steps = Math.ceil(dt / (1 / 240));
    const h = dt / steps;
    for (let i = 0; i < steps; i++) {
      joy.vx += (SPRING_K * (tx - joy.x) - SPRING_C * joy.vx) * h;
      joy.vy += (SPRING_K * (ty - joy.y) - SPRING_C * joy.vy) * h;
      joy.x += joy.vx * h; joy.y += joy.vy * h;
    }
    if (Math.abs(joy.x - tx) < 1e-4 && Math.abs(joy.vx) < 1e-3) { joy.x = tx; joy.vx = 0; }
    if (Math.abs(joy.y - ty) < 1e-4 && Math.abs(joy.vy) < 1e-3) { joy.y = ty; joy.vy = 0; }
  }
  if (joy.x !== px || joy.y !== py) joy.dirty = true;
}

// Valore con zona morta, riscalato in modo che appena fuori dalla zona parta da 0.
function stickOutput() {
  const m = Math.hypot(joy.x, joy.y);
  if (m < DEADZONE) return { x: 0, y: 0, m: 0 };
  const k = Math.min(1, (m - DEADZONE) / (1 - DEADZONE)) / m;
  return { x: joy.x * k, y: joy.y * k, m: m * k };
}

function circle(x, y, r) { g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); }

function drawStick() {
  const S = stick.width, c = S / 2;
  g.clearRect(0, 0, S, S);

  // Piastra di base
  const pad = S * 0.035, w = S - pad * 2;
  g.beginPath(); g.roundRect(pad, pad, w, w, S * 0.12);
  let gr = g.createLinearGradient(0, pad, 0, S - pad);
  gr.addColorStop(0, '#36363d'); gr.addColorStop(1, '#101013');
  g.fillStyle = gr; g.fill();
  g.lineWidth = S * 0.01; g.strokeStyle = 'rgba(255,255,255,.10)'; g.stroke();

  // Viti negli angoli
  const so = pad + S * 0.085, sr = S * 0.026;
  for (const [x, y] of [[so, so], [S - so, so], [so, S - so], [S - so, S - so]]) {
    circle(x, y, sr);
    gr = g.createRadialGradient(x - sr * 0.4, y - sr * 0.4, 0, x, y, sr);
    gr.addColorStop(0, '#e0e0e0'); gr.addColorStop(1, '#55555c');
    g.fillStyle = gr; g.fill();
    g.strokeStyle = '#2a2a2e'; g.lineWidth = S * 0.007;
    g.beginPath(); g.moveTo(x - sr * 0.6, y + sr * 0.6); g.lineTo(x + sr * 0.6, y - sr * 0.6); g.stroke();
  }

  // Cloche da caccia vista dal posto di pilotaggio: da dietro e un po' dall'alto (EYE sopra
  // l'orizzonte). L'asta ruota attorno al perno: spinta in avanti la cima si allontana, sullo
  // schermo sale e si allunga; tirata indietro viene verso chi guarda e si accorcia.
  // Z: scala della cloche rispetto al riquadro (le misure qui sotto sono frazioni di Z).
  const Z = S * 1.2, EYE = 40 * DEG, TILT = 22 * DEG, L = Z * 0.42, FLAT = Math.sin(EYE);   // FLAT: cerchi a terra → ellissi
  const px = c, py = c + S * 0.22;
  const a = joy.y * TILT, b = joy.x * TILT;
  const tx = px + L * Math.sin(b), ty = py - L * Math.cos(a - EYE) * Math.cos(b);
  const dx = tx - px, dy = ty - py, len = Math.hypot(dx, dy), ang = Math.atan2(dx, -dy);
  const at = (f) => [px + dx * f, py + dy * f];   // punto lungo l'asta, f = 0 perno … 1 cima

  // Pozzetto con le tacche delle 8 direzioni
  const wr = Z * 0.27;
  g.beginPath(); g.ellipse(px, py, wr, wr * FLAT, 0, 0, Math.PI * 2);
  gr = g.createRadialGradient(px, py, 0, px, py, wr);
  gr.addColorStop(0, '#020203'); gr.addColorStop(1, '#16161b');
  g.fillStyle = gr; g.fill();
  g.strokeStyle = 'rgba(255,255,255,.08)'; g.lineWidth = Z * 0.008; g.stroke();
  g.strokeStyle = 'rgba(255,176,0,.4)'; g.lineWidth = Z * 0.01; g.lineCap = 'round';
  for (let i = 0; i < 8; i++) {
    const th = i * Math.PI / 4, cx = Math.cos(th), sy = Math.sin(th) * FLAT;
    g.beginPath(); g.moveTo(px + cx * wr * 0.84, py + sy * wr * 0.84); g.lineTo(px + cx * wr * 0.95, py + sy * wr * 0.95); g.stroke();
  }

  // Ombra della cloche sul pozzetto
  const [shx, shy] = [px + dx * 0.35 + Z * 0.05, py + Z * 0.03];
  g.save(); g.translate(shx, shy); g.scale(1, FLAT * 0.8);
  gr = g.createRadialGradient(0, 0, 0, 0, 0, Z * 0.2);
  gr.addColorStop(0, 'rgba(0,0,0,.6)'); gr.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = gr; circle(0, 0, Z * 0.2); g.fill();
  g.restore();

  // Cuffia di gomma a soffietto: anelli sempre più stretti che seguono l'inclinazione
  const RINGS = 6;
  for (let i = 0; i <= RINGS; i++) {
    const f = i / RINGS * 0.2, r = Z * (0.17 - i * 0.017), [x, y] = at(f);
    g.beginPath(); g.ellipse(x, y, r, r * FLAT, ang * 0.6, 0, Math.PI * 2);
    gr = g.createLinearGradient(x - r, y - r * FLAT, x + r, y + r * FLAT);
    gr.addColorStop(0, i % 2 ? '#2a2b2f' : '#34353a'); gr.addColorStop(1, '#060607');
    g.fillStyle = gr; g.fill();
    g.strokeStyle = 'rgba(0,0,0,.7)'; g.lineWidth = Z * 0.006; g.stroke();
  }

  // Da qui si disegna nel riferimento della cloche: asse verso l'alto (y negativa), lungo len.
  g.save();
  g.translate(px, py); g.rotate(ang);
  const u = len, y0 = -0.3 * u, y1 = -0.84 * u, lerp = (p, q, k) => p + (q - p) * k;

  // Asta metallica fra la cuffia e l'impugnatura
  const sw = Z * 0.03;
  gr = g.createLinearGradient(-sw, 0, sw, 0);
  gr.addColorStop(0, '#3a3a40'); gr.addColorStop(0.35, '#d0d0d4'); gr.addColorStop(1, '#2a2a2e');
  g.fillStyle = gr; g.fillRect(-sw, -0.2 * u, sw * 2, -0.12 * u);

  // Impugnatura ergonomica, più gonfia sul lato del palmo (destra)
  const wB = Z * 0.055, wT = Z * 0.068;
  g.beginPath();
  g.moveTo(-wB, y0);
  g.bezierCurveTo(-wB * 1.15, lerp(y0, y1, 0.4), -wT * 1.05, lerp(y0, y1, 0.75), -wT, y1);
  g.lineTo(wT, y1);
  g.bezierCurveTo(wT * 1.3, lerp(y0, y1, 0.7), wB * 1.4, lerp(y0, y1, 0.35), wB, y0);
  g.quadraticCurveTo(0, y0 + Z * 0.025, -wB, y0);
  g.closePath();
  gr = g.createLinearGradient(-wT, 0, wT * 1.3, 0);
  gr.addColorStop(0, '#55585f'); gr.addColorStop(0.3, '#2c2e33'); gr.addColorStop(0.75, '#131417'); gr.addColorStop(1, '#070708');
  g.fillStyle = gr; g.fill();
  g.strokeStyle = 'rgba(0,0,0,.8)'; g.lineWidth = Z * 0.006; g.stroke();
  // Scanalature di gomma
  g.save(); g.clip();
  for (let k = 0; k < 6; k++) {
    const yy = lerp(y0, y1, 0.14 + k * 0.13);
    g.strokeStyle = 'rgba(0,0,0,.5)'; g.lineWidth = Z * 0.007;
    g.beginPath(); g.moveTo(-wT * 1.4, yy); g.lineTo(wT * 1.4, yy); g.stroke();
    g.strokeStyle = 'rgba(255,255,255,.07)'; g.lineWidth = Z * 0.004;
    g.beginPath(); g.moveTo(-wT * 1.4, yy + Z * 0.007); g.lineTo(wT * 1.4, yy + Z * 0.007); g.stroke();
  }
  g.restore();
  // Levetta del mignolo sul lato destro
  g.beginPath(); g.roundRect(wB * 1.15, lerp(y0, y1, 0.22), Z * 0.03, Z * 0.055, Z * 0.012);
  g.fillStyle = '#1e1f23'; g.fill(); g.strokeStyle = '#000'; g.lineWidth = Z * 0.005; g.stroke();

  // Testa: più la cloche viene verso chi guarda, più se ne vede la faccia superiore
  const hrx = Z * 0.085, hry = Z * (0.045 + 0.05 * Math.max(0, 1 - len / (L * Math.cos(EYE)))), hy = y1 - hry * 0.55;
  g.beginPath(); g.ellipse(0, hy, hrx, hry, 0, 0, Math.PI * 2);
  gr = g.createLinearGradient(-hrx, hy - hry, hrx, hy + hry);
  gr.addColorStop(0, '#4b4e55'); gr.addColorStop(0.5, '#25272b'); gr.addColorStop(1, '#0c0c0e');
  g.fillStyle = gr; g.fill();
  g.strokeStyle = 'rgba(0,0,0,.85)'; g.lineWidth = Z * 0.006; g.stroke();

  // Pulsante rosso di sgancio con il suo anello di protezione
  const rbx = -hrx * 0.38, rby = hy - hry * 0.15, rbr = Z * 0.022;
  circle(rbx, rby, rbr * 1.45); g.fillStyle = '#0b0b0d'; g.fill();
  circle(rbx, rby, rbr);
  gr = g.createRadialGradient(rbx - rbr * 0.35, rby - rbr * 0.4, rbr * 0.1, rbx, rby, rbr);
  gr.addColorStop(0, '#ffb3b3'); gr.addColorStop(0.35, '#ff2a2a'); gr.addColorStop(1, '#6a0000');
  g.fillStyle = gr; g.fill();

  // Hat switch a quattro vie
  const hx = hrx * 0.42, hhy = hy - hry * 0.2, hr = Z * 0.021;
  circle(hx, hhy, hr);
  gr = g.createRadialGradient(hx - hr * 0.3, hhy - hr * 0.3, 0, hx, hhy, hr);
  gr.addColorStop(0, '#9a9ea6'); gr.addColorStop(1, '#2a2c30');
  g.fillStyle = gr; g.fill();
  g.strokeStyle = '#111'; g.lineWidth = Z * 0.006;
  g.beginPath(); g.moveTo(hx - hr * 0.6, hhy); g.lineTo(hx + hr * 0.6, hhy); g.moveTo(hx, hhy - hr * 0.6); g.lineTo(hx, hhy + hr * 0.6); g.stroke();

  // Tastino centrale
  circle(0, hy + hry * 0.45, Z * 0.011);
  g.fillStyle = '#0a0a0b'; g.fill(); g.strokeStyle = 'rgba(255,255,255,.35)'; g.lineWidth = Z * 0.004; g.stroke();
  g.restore();
}

// Stessa lunghezza: riscrive il buffer esistente. Altrimenti geometria nuova, liberando

function setPositions(points, arr) {
  const attr = points.geometry.getAttribute('position');
  if (attr && attr.array.length === arr.length) {
    attr.array.set(arr);
    attr.needsUpdate = true;

  }
  points.geometry.dispose();
  points.geometry = new THREE.BufferGeometry();
  points.geometry.setAttribute('position', new THREE.BufferAttribute(arr, 3));
}

  const out = [];
  for (const row of rows) {
    const omm = Object.fromEntries(GP_FIELDS.map((k, i) => [k, row[i]]));
    const name = omm.OBJECT_NAME || 'NORAD ' + omm.NORAD_CAT_ID;
    try {
      out.push({
        name, id: omm.NORAD_CAT_ID, cospar: omm.OBJECT_ID || '',
        epoch: new Date(omm.EPOCH.endsWith('Z') ? omm.EPOCH : omm.EPOCH + 'Z'),
        kind: objectKind(name),
        satrec: sat.json2satrec(omm),
        pos: new THREE.Vector3(), ok: false, lat: 0, lon: 0, alt: 0, speed: 0,
      });
    } catch { /* elementi malformati: li salto */ }
  }
  return out;
}

// Primo indirizzo che risponde con un array JSON non vuoto.
async function fetchJsonArray(urls) {
  let last = null;
  for (const url of urls) {
    try {
      const res = await fetch(url);
      const text = await res.text();
      let json = null;
      try { json = JSON.parse(text); } catch { /* agli errori CelesTrak risponde con testo semplice */ }
      if (res.ok && Array.isArray(json) && json.length) return json;
      last = new Error(text.slice(0, 160) || 'HTTP ' + res.status);
    } catch (err) {
      last = err;
    }
  }
  throw last;
}

// Prima l'API del sito, che tiene una copia dei dati di CelesTrak (api/server.py): così CelesTrak
// non vede un download per ogni visitatore e non risponde 403 a chi condivide l'IP con altri.
// Dove l'API non c'è (file aperto dal PC) si chiede direttamente a CelesTrak.
async function fetchGp(group) {
  const key = 'gp:' + group;
  let cached = null;
  try { cached = JSON.parse(localStorage.getItem(key)); } catch { /* storage non disponibile */ }
  if (cached && Date.now() - cached.t < GP_MAX_AGE_MS) return cached;
  try {
    const g = encodeURIComponent(group);
    const json = await fetchJsonArray([`api/gp/${g}`, `https://celestrak.org/NORAD/elements/gp.php?GROUP=${g}&FORMAT=json`]);
    const data = { t: Date.now(), rows: json.map((o) => GP_FIELDS.map((k) => o[k])) };
    try { localStorage.setItem(key, JSON.stringify(data)); } catch { /* cache piena: pazienza */ }
    return data;
  } catch (err) {
    if (cached) return cached;   // meglio dati di qualche ora fa che niente
    throw err;
  }
}
// Cache del vecchio formato TLE: non serve più e occupa spazio.
try {
  for (const k of Object.keys(localStorage)) if (k.startsWith('tle:')) localStorage.removeItem(k);
} catch { /* storage non disponibile */ }

// Orbita "fotografata" adesso: punti lungo un periodo, tutti ruotati con il GMST
// attuale, così l'ellisse è chiusa e il satellite ci sta sopra.
function orbitBuffer(list, now, gmst) {
  const out = new Float32Array(list.length * ORBIT_SAMPLES * 3), v = new THREE.Vector3();
  let k = 0;
  for (const s of list) {
    const periodMs = 2 * Math.PI / s.satrec.no * 60000;
    for (let j = 0; j < ORBIT_SAMPLES; j++) {
      const pv = propagate(s.satrec, new Date(now.getTime() + j / ORBIT_SAMPLES * periodMs));
      if (!pv) continue;
      ecfToScene(sat.eciToEcf(pv.position, gmst), v);
      out[k++] = v.x; out[k++] = v.y; out[k++] = v.z;
    }
  }
  return out.subarray(0, k);
}

const isLive = () => sats.list.length <= LIVE_MAX;

// Posizioni attuali: icone, anello della selezione, "sopra di me".
function updatePositions(now = new Date()) {
  const gmst = sat.gstime(now);
  const byKind = { sat: [], station: [], rb: [], deb: [] };
  sats.list.forEach((s) => {
    const pv = propagate(s.satrec, now);
    s.ok = !!pv;
    if (pv) {
      s.ecf = sat.eciToEcf(pv.position, gmst);
      ecfToScene(s.ecf, s.pos);
      const geo = sat.eciToGeodetic(pv.position, gmst);
      s.lat = geo.latitude / DEG; s.lon = wrapPi(geo.longitude) / DEG; s.alt = geo.height;
      s.speed = Math.hypot(pv.velocity.x, pv.velocity.y, pv.velocity.z);
    } else {
      s.pos.set(0, 0, 0);   // decaduto o non propagabile: resta nascosto dentro la Terra
    }
    if (shown(s)) byKind[s.kind].push(s.pos.x, s.pos.y, s.pos.z);
  });
  for (const [kind, dots] of Object.entries(KIND_DOTS)) setPositions(dots, new Float32Array(byKind[kind]));
  orbitsLayer.rotation.y = sats.orbitGmst - gmst;   // la Terra è girata dal calcolo delle orbite
  sats.positionsAt = now.getTime();
  updateSelection();
  updateOverhead();
}

// Aggiornamento completo: posizioni e orbite.
function refreshPositions() {
  const now = new Date();
  sats.refreshedAt = now.getTime();
  sats.orbitGmst = sat.gstime(now);
  updatePositions(now);
  satDots.material.size = sats.list.length > 1000 ? 12 : 24;   // con migliaia di satelliti (Starlink) icone più piccole
  const live = sats.list.filter(shown);
  setPositions(orbitDots, live.length <= ALL_ORBITS_MAX ? orbitBuffer(live, now, sats.orbitGmst) : new Float32Array(0));
  updateSelectedOrbit();
}

// Ogni caricamento ha un numero: vale solo la risposta (o l'errore) dell'ultimo, anche se nel
// frattempo si è tornati allo stesso gruppo (A, poi B, poi di nuovo A).
let groupReq = 0;
async function loadGroup(group) {
  const req = ++groupReq;
  sats.group = group;
  sats.list = [];
  sats.error = '';
  selectSat(null);
  for (const dots of Object.values(KIND_DOTS)) setPositions(dots, new Float32Array(0));
  setPositions(orbitDots, new Float32Array(0));
  setPositions(overheadRings, new Float32Array(0));
  try { localStorage.setItem('group', group); } catch { /* ok */ }
  updateSatInfo();
  try {
    const data = await fetchGp(group);
    if (req !== groupReq) return;   // nel frattempo è partito un altro caricamento
    sats.list = parseGp(data.rows);
    sats.gpAt = data.t;
    refreshPositions();
    fitZoomToGroup();
  } catch (err) {
    if (req !== groupReq) return;
    console.error(err);
    sats.error = 'dataUnavailable';
  }
  updateSatInfo();
}

// Allarga la vista se il gruppo ha orbite alte (GPS, geostazionari).
function fitZoomToGroup() {
  const radii = sats.list.filter((s) => s.ok).map((s) => s.pos.length()).sort((a, b) => a - b);
  if (!radii.length) return;
  const r = radii[Math.floor(radii.length * 0.95)];
  view.zoomTarget = r > 1.6 ? Math.max(0.12, 0.85 / r) : Math.max(view.zoom, 0.8);
}

// Ogni secondo: posizioni dei gruppi piccoli; ogni 10 minuti: aggiornamento completo.
async function tick() {
  if (sats.list.length && !sats.busy && Date.now() - sats.refreshedAt >= POSITION_REFRESH_MS) {
    sats.busy = true;
    try {
      if (Date.now() - sats.gpAt >= GP_MAX_AGE_MS) {
        const group = sats.group;
        const data = await fetchGp(group).catch(() => null);
        if (data && data.t !== sats.gpAt && sats.group === group) {
          const selId = sats.selected?.id;
          sats.list = parseGp(data.rows);
          sats.gpAt = data.t;
          sats.selected = sats.list.find((s) => s.id === selId) || null;
          if (!sats.selected && card.dataset.mode === 'sat') closeCard();
          // Il satellite selezionato ora è un oggetto nuovo: i dettagli ancora in arrivo per il
          // vecchio verrebbero scartati, quindi si richiedono (sono in cache, costa poco).
          else if (sats.selected && !card.hidden && card.dataset.mode === 'sat') loadDetails(sats.selected);
        }
      }
      refreshPositions();
    } finally {
      sats.busy = false;
    }
  } else if (sats.list.length && !sats.busy && isLive()) {
    updatePositions();
  }
  updateSatInfo();
}
setInterval(tick, 1000);

const hhmm = (ms) => new Date(ms).toLocaleTimeString(locale(), { hour: '2-digit', minute: '2-digit' });
function updateSatInfo() {
  let s;
  if (sats.error) s = t(sats.error);
  else if (!sats.list.length) s = t('satLoading');
  else if (isLive()) s = t('satLive', sats.list.filter(shown).length);
  else {
    const left = Math.max(0, POSITION_REFRESH_MS - (Date.now() - sats.refreshedAt)) / 1000;
    const mm = Math.floor(left / 60), ss = String(Math.floor(left % 60)).padStart(2, '0');
    s = t('satUpdated', sats.list.filter(shown).length, hhmm(sats.refreshedAt), `${mm}:${ss}`);
  }
  $('satinfo').textContent = s;
}

/* ---------- Selezione con clic/tocco ---------- */
const tmpW = new THREE.Vector3();
function hiddenBehindEarth(p) {
  // Il segmento camera -> punto attraversa la sfera terrestre (raggio 1, centro nell'origine)?
  const o = camera.position;
  const d = tmpW.copy(p).sub(o), len = d.length();
  d.divideScalar(len);
  const b = o.dot(d), c = o.lengthSq() - 1, disc = b * b - c;
  if (disc < 0) return false;
  const t = -b - Math.sqrt(disc);
  return t > 0 && t < len - 1e-4;
}
function pickSatellite(cx, cy, radiusPx) {
  satellitesLayer.updateMatrixWorld();
  const m = satellitesLayer.matrixWorld, p = new THREE.Vector3();
  let best = null, bestD = radiusPx;
  for (const s of sats.list) {
    if (!shown(s)) continue;
    p.copy(s.pos).applyMatrix4(m);
    if (hiddenBehindEarth(p)) continue;
    p.project(camera);
    if (p.z > 1) continue;
    const d = Math.hypot((p.x + 1) / 2 * window.innerWidth - cx, (1 - p.y) / 2 * window.innerHeight - cy);
    if (d < bestD) { bestD = d; best = s; }
  }
  return best;
}

function selectSat(s) {
  sats.selected = s;
  updateSelection();
  updateSelectedOrbit();
  if (s) openCard(s); else closeCard();
}
function updateSelection() {
  const s = sats.selected;
  selRing.visible = !!(s && s.ok);
  if (!selRing.visible) return;
  setPositions(selRing, new Float32Array([s.pos.x, s.pos.y, s.pos.z]));
  renderCardLive();
}
function updateSelectedOrbit() {
  const s = sats.selected;
  selOrbitDots.visible = !!(s && s.ok);
  if (selOrbitDots.visible) setPositions(selOrbitDots, orbitBuffer([s], new Date(sats.refreshedAt), sats.orbitGmst));
}

// Con le stesse righe aggiorna solo i testi cambiati: con l'aggiornamento ogni secondo
// non si perde il testo selezionato nella schedina.
function renderRows(dl, rows) {
  const el = dl.children;
  if (el.length === rows.length * 2) {
    rows.forEach(([k, v], i) => {
      if (el[2 * i].textContent !== k) el[2 * i].textContent = k;
      if (el[2 * i + 1].textContent !== v) el[2 * i + 1].textContent = v;
    });
    return;
  }
  dl.replaceChildren(...rows.flatMap(([k, v]) => {
    const dt = document.createElement('dt'), dd = document.createElement('dd');
    dt.textContent = k; dd.textContent = v;
    return [dt, dd];
  }));
}
function renderCardLive() {
  const s = sats.selected;
  if (!s || card.hidden || card.dataset.mode !== 'sat') return;
  const r = s.satrec, n = r.no / 60, a = Math.cbrt(MU / (n * n));
  const ageH = (sats.positionsAt - s.epoch) / 3600000;
  renderRows($('cardLive'), s.ok ? [
    [t('altitude'), fmt(s.alt) + ' km'],
    [t('speed'), fmt(s.speed, 2) + ' km/s'],
    [t('position'), `${fmt(Math.abs(s.lat), 1)}°${s.lat >= 0 ? 'N' : 'S'} ${fmt(Math.abs(s.lon), 1)}°${s.lon >= 0 ? 'E' : 'W'}`],
    [t('inclination'), fmt(r.inclo / DEG, 1) + '°'],
    [t('period'), fmt(2 * Math.PI / r.no, 1) + ' min'],
    [t('apsides'), `${fmt(a * (1 + r.ecco) - R_EQ)} / ${fmt(a * (1 - r.ecco) - R_EQ)} km`],
    [t('orbitalData'), ageH < 48 ? t('ageHours', fmt(ageH)) : t('ageDays', fmt(ageH / 24))],
    [t('positionAt'), isLive() ? t('now') : hhmm(sats.positionsAt)],
  ] : [[t('status'), t('notComputable')]]);
}
// La schedina ha due modalità: 'sat' (un satellite) e 'overhead' (elenco "sopra di me").
function setCardMode(mode) {
  card.dataset.mode = mode;
  card.hidden = false;
  for (const id of ['cardLive', 'cardInfo', 'cardN2yo']) $(id).hidden = mode !== 'sat';
  $('cardList').hidden = mode !== 'overhead';
  $('cardAll').hidden = true;   // la sezione N2YO la mostra renderAllAbove
  $('cardImg').hidden = $('cardImgCredit').hidden = $('cardDesc').hidden = $('cardWiki').hidden = $('cardDock').hidden = true;
  card.scrollTop = 0;
}
function openCard(s) {
  setCardMode('sat');
  $('cardTitle').textContent = s.name;
  $('cardSub').textContent = `NORAD ${s.id}` + (s.cospar ? ` · ${s.cospar}` : '');

  $('cardImg').removeAttribute('src');
  if (s.id === ISS_ID) {   // minigioco di attracco, con quota e velocità vere della ISS

    $('cardDock').hidden = false;

function closeCard() { card.hidden = true; }
$('cardClose').addEventListener('click', () => selectSat(null));
$('cardCenter').addEventListener('click', () => {

// Catalogo: dall'API del sito un file per gruppo, scaricato alla prima schedina. Dove l'API non
// c'è, CelesTrak un oggetto alla volta (in locale soltanto: molte schede di fila fanno bloccare l'IP).
const satcatGroups = new Map(), satcatCache = new Map(), wikiCache = new Map();
function getSatcatGroup(group) {
  if (!satcatGroups.has(group)) {
    satcatGroups.set(group, fetchJsonArray([`api/satcat/${encodeURIComponent(group)}`])
      .then((a) => new Map(a.map((o) => [o.NORAD_CAT_ID, o])))
      .catch(() => { satcatGroups.delete(group); return null; }));
  }
  return satcatGroups.get(group);
}
async function getSatcat(id) {
  const byId = await getSatcatGroup(sats.group);
  if (byId) return byId.get(id) || null;
  if (!satcatCache.has(id)) {
    satcatCache.set(id, fetch(`https://celestrak.org/satcat/records.php?CATNR=${id}&FORMAT=json`)
      .then((r) => r.json()).then((a) => a[0] || null).catch(() => null));
  }
  return satcatCache.get(id);
}
// Descrizione e voce di Wikipedia nella lingua scelta (con l'altra come riserva per le etichette).
function getWiki(id) {
  const key = lang + ':' + id;
  if (!wikiCache.has(key)) {
    // Più voci possono condividere il numero NORAD (es. ISS e il modulo Zarja): vince la più citata.
    const q = `SELECT ?item ?itemLabel ?itemDescription ?image ?article WHERE {
      ?item wdt:P377 "${id}"; wikibase:sitelinks ?links.
      OPTIONAL { ?item wdt:P18 ?image }
      OPTIONAL { ?article schema:about ?item; schema:isPartOf <https://${lang}.wikipedia.org/> }
      SERVICE wikibase:label { bd:serviceParam wikibase:language "${lang === 'it' ? 'it,en' : 'en,it'}". }
    } ORDER BY DESC(?links) LIMIT 1`;
    wikiCache.set(key, fetch('https://query.wikidata.org/sparql?format=json&query=' + encodeURIComponent(q))
      .then((r) => r.json()).then((j) => {
        const b = j.results.bindings[0];
        if (!b) return null;
        return {
          label: b.itemLabel?.value, description: b.itemDescription?.value,
          image: b.image?.value.replace(/^http:/, 'https:'),
          url: b.article?.value || b.item?.value,
        };
      }).catch(() => null));
  }
  return wikiCache.get(key);
}
async function loadDetails(s) {
  const l = lang;
  const [cat, wiki] = await Promise.all([getSatcat(s.id), getWiki(s.id)]);
  if (sats.selected !== s || card.dataset.mode !== 'sat' || lang !== l) return;   // nel frattempo è cambiato qualcosa
  renderRows($('cardInfo'), cat ? [
    [t('type'), loc(OBJECT_TYPE[cat.OBJECT_TYPE]) || cat.OBJECT_TYPE || '—'],
    [t('status'), loc(OPS_STATUS[cat.OPS_STATUS_CODE]) || '—'],
    [t('owner'), loc(OWNERS[cat.OWNER]) || cat.OWNER || '—'],
    [t('launch'), cat.LAUNCH_DATE ? fmtDate(cat.LAUNCH_DATE) : '—'],
    [t('launchSite'), SITES[cat.LAUNCH_SITE] || cat.LAUNCH_SITE || '—'],
    ...(cat.DECAY_DATE ? [[t('decay'), fmtDate(cat.DECAY_DATE)]] : []),
  ] : [[t('catalog'), t('catalogUnavailable')]]);
  if (wiki) {
    const desc = [wiki.label !== s.name ? wiki.label : '', wiki.description].filter(Boolean).join(' — ');
    $('cardDesc').textContent = desc;
    $('cardDesc').hidden = !desc;
    if (wiki.url) { $('cardWiki').href = wiki.url; $('cardWiki').hidden = false; }
    if (wiki.image) {
      // Le foto di Commons hanno licenze diverse (spesso CC BY-SA): il link porta alla
      // pagina del file con autore e licenza.
      const img = $('cardImg'), credit = $('cardImgCredit');
      img.onerror = () => { img.hidden = credit.hidden = true; };
      img.src = wiki.image + '?width=480';
      credit.href = wiki.image.replace('/wiki/Special:FilePath/', '/wiki/File:');
      img.hidden = credit.hidden = false;
    }
  }
}

/* ---------- Sopra di me ----------
   Posizione precisa dal browser (serve https, oppure il file aperto dal PC);
   se non c'è, su richiesta una posizione approssimativa dall'indirizzo IP. */
const MIN_ELEVATION = 10;   // gradi sopra l'orizzonte
let observerMarker = null;

function preciseLocation() {
  return new Promise((resolve, reject) => {
    if (!window.isSecureContext || !navigator.geolocation) {
      reject(new Error('geoHttps'));   // i messaggi sono chiavi dei testi tradotti
      return;
    }
    navigator.geolocation.getCurrentPosition(
      (p) => resolve({ lat: p.coords.latitude, lon: p.coords.longitude, source: 'GPS', accuracy: p.coords.accuracy }),
      (err) => reject(new Error(err.code === 1 ? 'geoDenied' : err.code === 3 ? 'geoTimeout' : 'geoUnavailable')),
      { timeout: 15000, maximumAge: 10 * 60 * 1000 },
    );
  });
}
async function approxLocation() {
  const j = await (await fetch('https://get.geojs.io/v1/ip/geo.json')).json();
  return { lat: +j.latitude, lon: +j.longitude, source: 'rete', city: j.city };
}

function updateOverhead() {
  const o = sats.observer;
  if (!o) return;
  const gd = { latitude: o.lat * DEG, longitude: o.lon * DEG, height: 0.1 };
  sats.overhead = sats.list
    .filter(shown)
    .map((s) => {
      const la = sat.ecfToLookAngles(gd, s.ecf);
      return { s, el: la.elevation / DEG, az: la.azimuth / DEG, range: la.rangeSat };
    })
    .filter((x) => x.el >= MIN_ELEVATION)
    .sort((a, b) => b.el - a.el);
  setPositions(overheadRings, new Float32Array(sats.overhead.flatMap(({ s }) => [s.pos.x, s.pos.y, s.pos.z])));
  if (!card.hidden && card.dataset.mode === 'overhead') renderOverheadList();
}

const para = (text) => { const el = document.createElement('p'); el.textContent = text; return el; };
// msgKey/detailKey sono chiavi dei testi: al cambio di lingua la schedina si ridisegna uguale.

  renderAllAbove();
  if (!o) {

    if (offerApprox) {
      const b = document.createElement('button');
      b.className = 'pill';
      b.textContent = t('ovUseApprox');
      b.addEventListener('click', async () => {
        const req = ++locationReq;
        renderOverheadCard('ovAskingApprox');
        try {
          const o = await approxLocation();
          if (stillAsking(req)) setObserver(o);
        } catch {
          if (stillAsking(req)) renderOverheadCard('ovApproxFail');
        }
      });
      list.append(para(t('ovOfferApprox')), b);
    }
    return;
  }
  renderOverheadList();
}
// Ricostruisce l'elenco solo se cambiano i satelliti o il loro ordine, altrimenti
// aggiorna i testi: con l'aggiornamento ogni secondo un clic in corso non va perso.
let overheadHead = null, overheadInfo = [];
function renderOverheadList() {
  const o = sats.observer, list = $('cardList');
  if (!o) return;
  const where = `${fmt(Math.abs(o.lat), 2)}°${o.lat >= 0 ? 'N' : 'S'} ${fmt(Math.abs(o.lon), 2)}°${o.lon >= 0 ? 'E' : 'W'}`;
  const how = o.source === 'GPS' ? `GPS ±${fmt(o.accuracy)} m` : t('fromNetwork') + (o.city ? ' · ' + o.city : '');
  $('cardSub').textContent = `${where} · ${how}`;
  const ids = sats.overhead.map(({ s }) => s.id).join();
  if (list.dataset.ids !== ids) {
    list.dataset.ids = ids;
    overheadHead = para('');
    overheadInfo = [];
    list.replaceChildren(overheadHead, ...sats.overhead.map(({ s }) => {
      const b = document.createElement('button');
      b.className = 'sat-row';
      const name = document.createElement('span'), info = document.createElement('span');
      name.textContent = s.name;
      overheadInfo.push(info);
      b.append(name, info);
      // Per numero NORAD: dopo un nuovo download degli elementi gli oggetti cambiano.
      b.addEventListener('click', () => selectSat(sats.list.find((x) => x.id === s.id) || null));
      return b;
    }));
  }
  const when = isLive() ? t('now') : t('positionsAt', hhmm(sats.positionsAt));
  const group = loc(GROUPS[sats.group]);
  overheadHead.textContent = sats.overhead.length
    ? t('ovSome', sats.overhead.length, group, MIN_ELEVATION, when)
    : t('ovNone', group, MIN_ELEVATION);
  const compass = t('compass');
  sats.overhead.forEach(({ el, az, range }, i) => {
    const txt = `${fmt(el)}° ${compass[Math.round(az / 45) % 8]} · ${fmt(range)} km`;
    if (overheadInfo[i].textContent !== txt) overheadInfo[i].textContent = txt;
  });
}

function setObserver(o) {
  sats.observer = o;
  if (!observerMarker) observerMarker = addMarker(o.lat, o.lon, { color: 0x4fe3ff, size: 0.02 });
  else latLonToVector3(o.lat, o.lon, 0, observerMarker.position);
  view.homing = geoToView(o.lat, o.lon);
  view.zoomTarget = 1.5;
  updateOverhead();
  renderOverheadCard();
  loadAllAbove();
}

/* ---------- Sopra di me, tutti gli oggetti di ogni gruppo: N2YO tramite l'API del sito ----------
   N2YO dà solo la posizione al momento della richiesta (niente elementi orbitali): icone ferme
   sul globo e un elenco. Si aggiorna premendo di nuovo SOPRA DI ME. */
const ALL_MAX_ROWS = 40;
const allAbove = { list: [], at: 0, state: 'idle' };   // state: idle, loading, ok o la chiave di un errore
const allShown = () => allAbove.list.filter((x) => visibleKind(x.kind));

/* Sul globo si disegnano su un canvas 2D sopra la scena: a ogni fotogramma le posizioni si
   proiettano sullo schermo. Satelliti e stazioni restano sempre singoli; stadi di razzo e
   detriti si raggruppano per distanza: uno entra nel primo cluster entro CLUSTER_RADIUS px,
   altrimenti ne apre uno nuovo. Con lo zoom si allontanano sullo schermo e i cluster si aprono.
   L'elenco è sempre nello stesso ordine, quindi i cluster restano stabili mentre il globo gira. */
const CLUSTERED = new Set(['rb', 'deb']);
const KIND_ICON = { sat: [16, drawSatIcon, '#ffc23a'], station: [22, drawStationIcon, '#f2f4f8'],
  rb: [15, drawRocketIcon, '#ff8a1f'], deb: [12, drawDebrisIcon, '#a7aeb8'] };   // lato in px, disegno, colore
const CLUSTER_RADIUS = 58;   // px
const objCanvas = $('objects'), og = objCanvas.getContext('2d');
const objSprites = {};
let objHits = [], objDrawn = false, objLabel = null;   // objLabel: { it, until } nome dopo un tocco
function objSprite(kind, dpr) {
  const key = kind + dpr;
  if (!objSprites[key]) objSprites[key] = iconCanvas(KIND_ICON[kind][1], Math.ceil(KIND_ICON[kind][0] * dpr));
  return objSprites[key];
}
function drawObjects() {
  const items = sats.observer && allAbove.state === 'ok' ? allShown() : [];
  if (!items.length && !objDrawn) return;
  const dpr = Math.min(window.devicePixelRatio || 1, 2), w = window.innerWidth, h = window.innerHeight;
  if (objCanvas.width !== Math.round(w * dpr) || objCanvas.height !== Math.round(h * dpr)) {
    objCanvas.width = Math.round(w * dpr); objCanvas.height = Math.round(h * dpr);
  }
  og.setTransform(dpr, 0, 0, dpr, 0, 0);
  og.clearRect(0, 0, w, h);
  objHits = [];
  objDrawn = items.length > 0;
  if (!objDrawn) return;

  // Più si è vicini, più il raggio si stringe: allo zoom massimo restano quasi solo oggetti singoli.
  const R = CLUSTER_RADIUS * Math.min(1, 1.5 / view.zoom) ** 1.4;
  const m = satellitesLayer.matrixWorld, p = new THREE.Vector3();
  const clusters = [], singles = [], grid = new Map();   // grid: celle di lato R per cercare solo i cluster vicini
  // Niente oggetti sotto l'intestazione e il pannello comandi: coprirebbero testi e pulsanti.
  const covered = [document.querySelector('.hud'), deck].map((el) => el.getBoundingClientRect());
  const underUi = (x, y) => covered.some((r) => x > r.left - 8 && x < r.right + 8 && y > r.top - 8 && y < r.bottom + 8);
  for (const it of items) {
    p.copy(it.pos).applyMatrix4(m);
    if (hiddenBehindEarth(p)) continue;
    p.project(camera);
    if (p.z > 1 || Math.abs(p.x) > 1.05 || Math.abs(p.y) > 1.05) continue;
    const x = (p.x + 1) / 2 * w, y = (1 - p.y) / 2 * h, gx = Math.floor(x / R), gy = Math.floor(y / R);
    if (underUi(x, y)) continue;
    if (!CLUSTERED.has(it.kind)) { singles.push({ x, y, it }); continue; }
    let best = null, bestD = R;
    for (let i = -1; i <= 1; i++) {
      for (let j = -1; j <= 1; j++) {
        for (const c of grid.get((gx + i) + ',' + (gy + j)) || []) {
          const d = Math.hypot(c.cx - x, c.cy - y);
          if (d < bestD) { best = c; bestD = d; }
        }
      }
    }
    if (best) { best.x += x; best.y += y; best.items.push(it); continue; }
    const c = { cx: x, cy: y, x, y, items: [it] }, key = gx + ',' + gy;
    clusters.push(c);
    if (!grid.has(key)) grid.set(key, []);
    grid.get(key).push(c);
  }
  const drawSingle = (x, y, it) => {
    const [size] = KIND_ICON[it.kind];
    og.drawImage(objSprite(it.kind, dpr), x - size / 2, y - size / 2, size, size);
    objHits.push({ x, y, r: size / 2 + 6, items: [it] });
  };
  og.textAlign = 'center'; og.textBaseline = 'middle';
  for (const c of clusters) {
    const n = c.items.length, x = c.x / n, y = c.y / n;
    if (n === 1) { drawSingle(x, y, c.items[0]); continue; }
    // Cluster: anello del colore del tipo più numeroso e il numero degli oggetti
    const count = {};
    for (const it of c.items) count[it.kind] = (count[it.kind] || 0) + 1;
    const main = Object.keys(count).sort((a, b) => count[b] - count[a])[0];
    const r = 10 + Math.min(9, Math.log2(n) * 2);
    og.beginPath(); og.arc(x, y, r, 0, Math.PI * 2);
    og.fillStyle = 'rgba(10,11,16,.82)'; og.fill();
    og.lineWidth = 2; og.strokeStyle = KIND_ICON[main][2]; og.stroke();
    og.fillStyle = '#e8e6df'; og.font = `${n > 99 ? 7 : 8}px 'Press Start 2P', monospace`;
    og.fillText(String(n), x, y + 1);
    objHits.push({ x, y, r: r + 4, items: c.items });
  }
  for (const { x, y, it } of singles) drawSingle(x, y, it);   // sopra i cluster
  // Nome dell'oggetto toccato, per qualche secondo
  if (objLabel && performance.now() < objLabel.until) {
    const hit = objHits.find((o) => o.items.length === 1 && o.items[0] === objLabel.it);
    if (hit) {
      const txt = `${objLabel.it.name} · ${fmt(objLabel.it.alt)} km`;
      og.font = '11px ui-monospace, Consolas, monospace';
      const tw = og.measureText(txt).width;
      og.fillStyle = 'rgba(10,11,16,.9)'; og.fillRect(hit.x - tw / 2 - 6, hit.y - hit.r - 22, tw + 12, 18);
      og.fillStyle = KIND_ICON[objLabel.it.kind][2]; og.fillText(txt, hit.x, hit.y - hit.r - 13);
    }
  } else objLabel = null;
}
// Tocco sugli oggetti di N2YO: un cluster avvicina la vista, un oggetto singolo mostra il nome
// (o apre la schedina, se è anche nel gruppo scelto). Vero se il tocco è stato usato qui.
function tapObjects(cx, cy, slop) {
  let best = null, bestD = Infinity;
  for (const o of objHits) {
    const d = Math.hypot(o.x - cx, o.y - cy);
    if (d < o.r + slop && d < bestD) { best = o; bestD = d; }
  }
  if (!best) return false;
  if (best.items.length > 1) {
    const v = new THREE.Vector3();
    for (const it of best.items) v.add(it.pos);
    v.normalize();   // centro del cluster, sulla Terra
    view.homing = geoToView(Math.asin(v.y) / DEG, Math.atan2(-v.z, v.x) / DEG);
    view.zoomTarget = Math.min(2.6, view.zoom * 2);
    return true;
  }
  const it = best.items[0], s = sats.list.find((y) => y.id === it.id);
  if (s && shown(s)) flyTo(s);
  else objLabel = { it, until: performance.now() + 4000 };
  return true;
}

let allReq = 0;   // vale solo la risposta dell'ultima richiesta, come per i gruppi
async function loadAllAbove() {
  const o = sats.observer, req = ++allReq;
  if (!o) return;
  allAbove.state = 'loading';
  renderAllAbove();
  try {
    // Al server la posizione arriva già arrotondata a mezzo grado (circa 50 km), come dice
    // l'informativa; per il calcolo dell'elevazione qui sotto resta quella precisa.
    const half = (v) => (Math.round(v * 2) / 2).toFixed(1);
    const res = await fetch(`api/above?lat=${half(o.lat)}&lon=${half(o.lon)}`);
    const j = await res.json().catch(() => ({}));
    if (req !== allReq) return;
    if (!res.ok) throw new Error(res.status === 429 ? 'allBusy' : 'allUnavailable');
    const gd = { latitude: o.lat * DEG, longitude: o.lon * DEG, height: 0.1 };
    allAbove.list = (j.above || []).map((a) => {
      const ecf = sat.geodeticToEcf({ latitude: a.satlat * DEG, longitude: a.satlng * DEG, height: a.satalt });
      const la = sat.ecfToLookAngles(gd, ecf);
      return {
        id: a.satid, name: a.satname, kind: objectKind(a.satname), lat: a.satlat, lon: a.satlng, alt: a.satalt,
        el: la.elevation / DEG, az: la.azimuth / DEG, pos: ecfToScene(ecf, new THREE.Vector3()),
      };
    }).filter((x) => x.el >= MIN_ELEVATION).sort((a, b) => b.el - a.el);
    allAbove.at = j.at * 1000;
    allAbove.state = 'ok';
  } catch (err) {
    if (req !== allReq) return;
    allAbove.list = [];
    allAbove.state = STR[lang][err.message] ? err.message : 'allUnavailable';
  }
  renderAllAbove();
}
function renderAllAbove() {
  const box = $('cardAll');
  box.hidden = card.dataset.mode !== 'overhead' || !sats.observer || allAbove.state === 'idle';
  if (box.hidden) return;
  const title = document.createElement('div');
  title.className = 'card-section';
  title.textContent = t('allTitle');
  if (allAbove.state !== 'ok') { box.replaceChildren(title, para(t(allAbove.state === 'loading' ? 'allLoading' : allAbove.state))); return; }
  const compass = t('compass'), list = allShown(), hidden = allAbove.list.length - list.length;
  const rows = list.slice(0, ALL_MAX_ROWS).map((x) => {
    const b = document.createElement('button');
    b.className = 'sat-row all-row k-' + x.kind;
    const name = document.createElement('span'), info = document.createElement('span');
    name.textContent = x.name;
    info.textContent = `${fmt(x.el)}° ${compass[Math.round(x.az / 45) % 8]} · ${fmt(x.alt)} km`;
    b.append(name, info);
    // Se è anche nel gruppo scelto apre la sua schedina, altrimenti porta il globo sopra di lui.
    b.addEventListener('click', () => {
      const s = sats.list.find((y) => y.id === x.id);
      if (s && shown(s)) flyTo(s);
      else { view.homing = geoToView(x.lat, x.lon); objLabel = { it: x, until: performance.now() + 4000 }; }
    });
    return b;
  });
  const credit = document.createElement('a');
  credit.className = 'card-credit';
  credit.href = 'https://www.n2yo.com/';
  credit.target = '_blank'; credit.rel = 'noopener';
  credit.textContent = t('allCredit');
  box.replaceChildren(
    title,
    para(list.length ? t('allSome', list.length, MIN_ELEVATION, hhmm(allAbove.at)) : t('allNone')),
    ...(hidden ? [para(t('allHidden', hidden))] : []),
    ...rows,
    ...(list.length > ALL_MAX_ROWS ? [para(t('allMore', list.length - ALL_MAX_ROWS))] : []),
    credit,
  );
}

// La posizione può arrivare dopo parecchi secondi: si usa solo se è l'ultima chiesta e la
// schedina "sopra di me" è ancora aperta, altrimenti sposterebbe il globo e riaprirebbe la
// schedina mentre si sta facendo altro.
let locationReq = 0;
const stillAsking = (req) => req === locationReq && !card.hidden && card.dataset.mode === 'overhead';
$('btnOverhead').addEventListener('click', async () => {
  sats.selected = null;
  updateSelection();
  updateSelectedOrbit();
  const req = ++locationReq;
  if (sats.observer) { setObserver(sats.observer); return; }
  renderOverheadCard();
  try {
    const o = await preciseLocation();
    if (stillAsking(req)) setObserver(o);
  } catch (err) {
    if (stillAsking(req)) renderOverheadCard('ovPreciseFail', true, STR[lang][err.message] ? err.message : 'geoUnavailable');
  }
});

// Seleziona un satellite e ci porta sopra il globo, allargando la vista se l'orbita è alta.
function flyTo(s) {
  selectSat(s);
  view.homing = geoToView(s.lat, s.lon);
  const r = s.pos.length();
  view.zoomTarget = r > 1.6 ? Math.max(0.12, 0.85 / r) : 1.4;
}

/* ---------- Vai alla ISS ----------
   Se nel gruppo scelto non c'è, passa alle stazioni spaziali. */
const ISS_ID = 25544;
async function goToIss() {
  let iss = sats.list.find((s) => s.id === ISS_ID);
  if (!iss) {
    $('group').value = 'stations';
    await loadGroup('stations');
    iss = sats.list.find((s) => s.id === ISS_ID);
  }
  if (!iss || !iss.ok) { setStatus('issUnavailable'); return; }
  flyTo(iss);
}
$('btnIss').addEventListener('click', goToIss);

/* ---------- Record del gruppo: il più veloce, il più lento, il più lontano e il più vicino ---------- */
const RECORDS = {
  fastest: (s) => s.speed, slowest: (s) => -s.speed,
  farthest: (s) => s.alt, closest: (s) => -s.alt,
};
function goToRecord(kind) {
  const score = RECORDS[kind];
  let best = null;
  for (const s of sats.list) if (shown(s) && (!best || score(s) > score(best))) best = s;
  if (best) flyTo(best);
}
for (const b of document.querySelectorAll('[data-record]')) {
  b.addEventListener('click', () => goToRecord(b.dataset.record));
}

// Menu dei gruppi
{
  const sel = $('group');
  for (const k of Object.keys(GROUPS)) sel.add(new Option(k, k));
  let saved = null;
  try { saved = localStorage.getItem('group'); } catch { /* ok */ }
  sel.value = GROUPS[saved] ? saved : 'visual';
  sel.addEventListener('change', () => { sel.blur(); loadGroup(sel.value); });
  loadGroup(sel.value);
}

/* ---------- Cambio lingua ---------- */
// Bandierine disegnate qui: le emoji delle bandiere su Windows diventano due lettere.
const FLAGS = {
  it: '<svg viewBox="0 0 3 2" preserveAspectRatio="none"><rect width="1" height="2" fill="#009246"/>'
    + '<rect x="1" width="1" height="2" fill="#fff"/><rect x="2" width="1" height="2" fill="#ce2b37"/></svg>',
  en: '<svg viewBox="0 0 60 30" preserveAspectRatio="xMidYMid slice"><clipPath id="ukc"><path d="M30,15h30v15zv15h-30zh-30v-15zv-15h30z"/></clipPath>'
    + '<path d="M0,0v30h60v-30z" fill="#012169"/><path d="M0,0 60,30M60,0 0,30" stroke="#fff" stroke-width="6"/>'
    + '<path d="M0,0 60,30M60,0 0,30" clip-path="url(#ukc)" stroke="#c8102e" stroke-width="4"/>'
    + '<path d="M30,0v30M0,15h60" stroke="#fff" stroke-width="10"/><path d="M30,0v30M0,15h60" stroke="#c8102e" stroke-width="6"/></svg>',
};
function applyLang() {
  document.documentElement.lang = lang;
  for (const el of document.querySelectorAll('[data-i18n]')) el.textContent = t(el.dataset.i18n);
  for (const el of document.querySelectorAll('[data-i18n-html]')) el.innerHTML = t(el.dataset.i18nHtml);
  for (const el of document.querySelectorAll('[data-i18n-aria]')) el.setAttribute('aria-label', t(el.dataset.i18nAria));
  for (const el of document.querySelectorAll('[data-i18n-title]')) el.title = t(el.dataset.i18nTitle);
  for (const o of $('group').options) o.textContent = loc(GROUPS[o.value]).toUpperCase();
  const flag = $('btnLang');
  flag.innerHTML = FLAGS[lang === 'it' ? 'en' : 'it'];   // la bandiera della lingua in cui si passa
  flag.title = t('langSwitch');
  flag.setAttribute('aria-label', t('langSwitch'));
  $('btnArm').title = t('armTitle');
  $('btnArm').setAttribute('aria-label', t('armTitle'));
  $('modeLabel').textContent = t(view.mode === 'fly' ? 'modeFly' : 'modeDrag');
  setStatus(statusKey);
  updateSatInfo();
  if (!card.hidden && card.dataset.mode === 'sat' && sats.selected) openCard(sats.selected);
  else if (!card.hidden && card.dataset.mode === 'overhead') renderOverheadCard(...overheadArgs);
}
/* ---------- MASTER ARM ---------- */
function applyArm() {
  $('btnArm').setAttribute('aria-checked', String(arm.on));
  $('armState').textContent = arm.on ? 'ARM' : 'SAFE';
}
$('btnArm').addEventListener('click', () => {
  arm.on = !arm.on;
  try { localStorage.setItem('arm', arm.on ? '1' : '0'); } catch { /* ok */ }
  applyArm();
  if (sats.selected && !shown(sats.selected)) selectSat(null);
  if (sats.list.length) refreshPositions();   // icone, orbite ed elenco "sopra di me" del gruppo
  renderAllAbove();
  updateSatInfo();
});
applyArm();

/* ---------- Saluto ---------- */
new ResizeObserver(() => document.documentElement.style.setProperty('--deck-h', `${$('deck').offsetHeight}px`)).observe($('deck'));
try { $('host').hidden = localStorage.getItem('hostClosed') === '1'; } catch { $('host').hidden = false; }
$('hostClose').addEventListener('click', () => {
  $('host').hidden = true;
  try { localStorage.setItem('hostClosed', '1'); } catch { /* ok */ }
});

$('btnLang').addEventListener('click', () => {
  lang = lang === 'it' ? 'en' : 'it';
  try { localStorage.setItem('lang', lang); } catch { /* ok */ }
  applyLang();
});
applyLang();

/* =========================================================================
   Loop
   ========================================================================= */
const coordsEl = $('coords');
let lastCoords = '';
function updateCoords() {
  const lat = view.tilt / DEG;
  const lon = wrapPi(-view.spin - Math.PI / 2) / DEG;
  const s = `LAT ${Math.abs(lat).toFixed(1).padStart(4, '0')}°${lat >= 0 ? 'N' : 'S'}  ` +
            `LON ${Math.abs(lon).toFixed(1).padStart(5, '0')}°${lon >= 0 ? 'E' : 'W'}`;
  if (s !== lastCoords) { coordsEl.textContent = s; lastCoords = s; }
}

let prev = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - prev) / 1000);
  prev = now;

  updateJoystick(dt);
  if (joy.dirty) { drawStick(); joy.dirty = false; }
  const out = stickOutput();
  updateIndicator(out);

  // Velocità proporzionale alla spinta, con un po' di inerzia.
  const sign = view.mode === 'fly' ? 1 : -1;
  const ease = 1 - Math.exp(-dt * 6);
  view.vSpin += (-out.x * MAX_SPIN * sign - view.vSpin) * ease;
  view.vTilt += (out.y * MAX_TILT * sign - view.vTilt) * ease;

  if (out.m > 0) view.homing = null;
  const k = 1 - Math.exp(-dt * 4);
  if (view.zoomTarget !== null) {
    setZoom(view.zoom + (view.zoomTarget - view.zoom) * k);
    if (Math.abs(view.zoomTarget - view.zoom) < 1e-3) view.zoomTarget = null;
  }
  syncZoomLever();
  if (view.homing) {
    view.spin += wrapPi(view.homing.spin - view.spin) * k;
    view.tilt += (view.homing.tilt - view.tilt) * k;
    view.vSpin = view.vTilt = 0;
    if (Math.abs(wrapPi(view.homing.spin - view.spin)) < 1e-3 && Math.abs(view.homing.tilt - view.tilt) < 1e-3) view.homing = null;
  } else {
    view.spin = wrapPi(view.spin + view.vSpin * dt);
    view.tilt += view.vTilt * dt;
    if (Math.abs(view.tilt) > TILT_LIMIT) { view.tilt = Math.sign(view.tilt) * TILT_LIMIT; view.vTilt = 0; }
  }

  earthPivot.rotation.set(view.tilt, view.spin, 0);
  updateCoords();
  renderer.render(scene, camera);
  drawObjects();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// Comodo per esperimenti dalla console del browser, es.:
//   globeApp.addMarker(45.07, 7.69, { color: 0x39ff7a })   // Torino
//   globeApp.addMarker(0, -30, { altKm: 420 })             // "satellite" a 420 km
window.globeApp = { THREE, scene, camera, earthPivot, satellitesLayer, latLonToVector3, addMarker, view, joy, sats, selectSat, refreshPositions, setObserver, allAbove, renderAllAbove, arm };
